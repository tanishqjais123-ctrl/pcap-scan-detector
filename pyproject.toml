[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-scan-detector"
version = "0.1.0"
description = "Flags possible TCP SYN port-scan behavior in PCAP files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pcap-scan = "pcap_scan_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
